<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Michal T. Ruprecht">
    <meta name="theme-color" content="#102925">
    {% include seo.html %}
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="preload" href="/assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
    {% if page.url == '/' %}<link rel="preload" href="/assets/images/profile-hero.webp" as="image" type="image/webp" fetchpriority="high">{% endif %}
    <link rel="stylesheet" href="/assets/css/portfolio.css">
    <script>document.documentElement.classList.add('has-js');</script>
    <script defer src="/assets/js/portfolio.js"></script>
  </head>
  <body class="{{ page.body_class }}">
    {% include site-header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include site-footer.html %}
  </body>
</html>
