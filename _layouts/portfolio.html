<!doctype html>
<html lang="en">
  <head>
    {% include analytics.html %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Michal T. Ruprecht">
    <meta name="theme-color" content="#102925">
    {% include seo.html %}
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="preload" href="/assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
    {% if page.url == '/' %}<link rel="preload" href="/assets/images/profile-hero-480.webp" as="image" type="image/webp" imagesrcset="/assets/images/profile-hero-480.webp 480w, /assets/images/profile-hero.webp 720w" imagesizes="(max-width: 760px) calc(100vw - 48px), 390px" fetchpriority="high">{% endif %}
    <link rel="stylesheet" href="/assets/css/portfolio.css?v={{ site.asset_version }}">
    <script>document.documentElement.classList.add('has-js');</script>
    <script defer src="/assets/js/portfolio.js?v={{ site.asset_version }}"></script>
    <script defer src="/assets/js/measurement.js?v={{ site.asset_version }}"></script>
  </head>
  <body class="{{ page.body_class }}">
    {% include site-header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include site-footer.html %}
  </body>
</html>
