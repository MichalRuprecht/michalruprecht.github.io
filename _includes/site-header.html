<header class="site-header">

      <nav class="portfolio-switcher" aria-label="Choose a portfolio">
        <a href="/">Journalism portfolio</a>
        <a href="/pages/ceramics" class="is-active" aria-current="page">Ceramics portfolio</a>

      <nav class="journalism-header-nav" aria-label="Primary navigation">
